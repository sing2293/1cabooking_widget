<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Tag Manager — GTM-KMXC2KC, the same container as 1cleanair.ca, installed with
         Google's standard snippet (as the site does): it pushes the gtm.js event the
         container's Page View triggers wait for. gtag() is defined for custom events. -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KMXC2KC');
    function gtag(){dataLayer.push(arguments);}</script>
    <!-- End Google Tag Manager -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_PAGE_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://internal.1cleanair.app" crossorigin />
    <!-- Non-blocking font load: preload the CSS, then promote it to a stylesheet
         once it's downloaded. The system-font fallback shows immediately and the
         page is interactive while Montserrat finishes loading (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Google Maps callback. The script itself is injected lazily by the
         lead form when the address field is focused, so it doesn't block
         first paint. -->
    <script>
      function initGoogleMaps() {
        window.googleMapsReady = true;
        window.dispatchEvent(new CustomEvent('googleMapsLoaded'));
      }
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KMXC2KC"
      height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
