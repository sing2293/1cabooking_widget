<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_PAGE_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://internal.1cleanair.app" crossorigin />
    <!-- Non-blocking font load: preload the CSS, then promote it to a stylesheet
         once it's downloaded. The system-font fallback shows immediately and the
         page is interactive while Montserrat finishes loading (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Google Maps callback. The script itself is injected lazily by the
         lead form when the address field is focused, so it doesn't block
         first paint. -->
    <script>
      function initGoogleMaps() {
        window.googleMapsReady = true;
        window.dispatchEvent(new CustomEvent('googleMapsLoaded'));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
